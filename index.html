<script>

async function showOrders() {

  showStatus(`
    <div class="card">
      ⏳ كنجيبو Orders...
    </div>
  `);

  const { data, error } = await supabaseClient
    .from("Ordres")
    .select(`
      *,
      Customers (
        name,
        nom,
        phone,
        telephone
      )
    `)
    .order("id", { ascending: false });

  if (error) {

    showStatus(`
      <div class="card">
        ❌ ${error.message}
      </div>
    `);

    return;
  }

  let html = `
    <div class="card">

      <h3>🛵 Orders</h3>

      <button
        class="secondary"
        onclick="showOrders()"
      >
        🔄 Actualiser
      </button>

    </div>
  `;

  if (!data || data.length === 0) {

    html += `
      <div class="card">
        مازال ماكاين حتى Order.
      </div>
    `;

  } else {

    data.forEach(order => {

      const customer = order.Customers || {};

      const customerName =
        customer.name ||
        customer.nom ||
        "Customer";

      const customerPhone =
        customer.phone ||
        customer.telephone ||
        "—";

      const total =
        order.total ??
        order.amount ??
        0;

      html += `
        <div class="card">

          <h3>
            🛵 Order #${order.id || ""}
          </h3>

          <br>

          👤 Customer:
          <b>${customerName}</b>

          <br><br>

          📞 ${customerPhone}

          <br><br>

          💰 Total:
          <b>${total} DH</b>

        </div>
      `;

    });
  }

  showStatus(html);
}

</script>
