  <script>

    // ==============================
    // SUPABASE CONFIGURATION
    // ==============================

    const SUPABASE_URL = "https://crnkygjsyaadfjqnzkhh.supabase.co/rest/v1/";

    const SUPABASE_KEY = "sb_publishable_-8hnrRPUy8k1EdNfUzkBHg_URwtmRHI";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // ==============================
    // STATUS
    // ==============================

    function showStatus(message) {
      const status = document.getElementById("status");

      status.style.display = "block";
      status.innerHTML = message;
    }


    // ==============================
    // CUSTOMERS
    // ==============================

    async function showCustomers() {

      showStatus("⏳ كنجيبو Customers...");

      const { data, error } = await supabaseClient
        .from("Customers")
        .select("*");

      if (error) {
        showStatus("❌ وقع مشكل: " + error.message);
        return;
      }

      if (!data || data.length === 0) {
        showStatus("👤 مازال ماكاين حتى Customer.");
        return;
      }

      let html = "<h3>👤 Customers</h3><br>";

      data.forEach(customer => {
        html += `
          <div style="
            padding:12px;
            margin-bottom:10px;
            background:#f5f5f5;
            border-radius:12px;
          ">
            ${customer.name || customer.nom || "Customer"}
          </div>
        `;
      });

      showStatus(html);
    }


    // ==============================
    // ORDERS
    // ==============================

    async function showOrders() {

      showStatus("⏳ كنجيبو Orders...");

      const { data, error } = await supabaseClient
        .from("Ordres")
        .select("*");

      if (error) {
        showStatus("❌ وقع مشكل: " + error.message);
        return;
      }

      if (!data || data.length === 0) {
        showStatus("🛵 مازال ماكاين حتى Order.");
        return;
      }

      let html = "<h3>🛵 Orders</h3><br>";

      data.forEach(order => {
        html += `

            margin-bottom:10px;
            background:#f5f5f5;
            border-radius:12px;
          ">
            Order #${order.id || ""}
          </div>
        `;
      });

      showStatus(html);
    }

        <br>
        نظام النقاط غادي نكملوه من بعد.
      `);

    }


    // ==============================
    // DASHBOARD
    // ==============================

    async function showDashboard() {

      showStatus("⏳ كنحسبو البيانات...");

      const customers = await supabaseClient
        .from("Customers")
        .select("*", { count: "exact", head: true });

      const orders = await supabaseClient
        .from("Ordres")
        .select("*", { count: "exact", head: true });

        <br><br>

      `);

    }
